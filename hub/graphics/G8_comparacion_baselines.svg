<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#F2D9D9"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#C00000" stroke-width="4"/>
    </pattern>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7F7F7F"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>
  <text x="960" y="82" text-anchor="middle" font-size="46" font-weight="700" fill="#1F3864">Comparison against baselines (Table III)</text>
  <text x="960" y="124" text-anchor="middle" font-size="26" font-weight="700" fill="#7F6000">80 s → under 3 s under comparable concurrency, on the same hardware</text>

  <!-- Chart area: x axis from 260 to 1660 (1400 px), scale 0-85s -->
  <!-- gridlines -->
  <g stroke="#E0E0E0" stroke-width="1.5">
    <line x1="260" y1="220" x2="260" y2="620"/>
    <line x1="589" y1="220" x2="589" y2="620"/>
    <line x1="918" y1="220" x2="918" y2="620"/>
    <line x1="1247" y1="220" x2="1247" y2="620"/>
    <line x1="1576" y1="220" x2="1576" y2="620"/>
  </g>
  <g font-size="18" fill="#7F7F7F" text-anchor="middle">
    <text x="260" y="650">0 s</text>
    <text x="589" y="650">20 s</text>
    <text x="918" y="650">40 s</text>
    <text x="1247" y="650">60 s</text>
    <text x="1576" y="650">80 s</text>
  </g>

  <!-- Row 1: Manual workflow (qualitative, hatched, open-ended) -->
  <text x="240" y="290" text-anchor="end" font-size="24" font-weight="700" fill="#262626">Manual workflow</text>
  <rect x="260" y="260" width="1420" height="70" fill="url(#hatch)" stroke="#C00000" stroke-width="2"/>
  <path d="M1680 260 l40 35 l-40 35 z" fill="#C00000"/>
  <text x="960" y="305" text-anchor="middle" font-size="22" font-weight="700" fill="#833333">DAYS (manual consolidation after the brigade) — off scale</text>

  <!-- Row 2: Full local replica -->
  <text x="240" y="430" text-anchor="end" font-size="24" font-weight="700" fill="#262626">Full local</text>
  <text x="240" y="458" text-anchor="end" font-size="24" font-weight="700" fill="#262626">replica</text>
  <rect x="260" y="400" width="1317" height="70" fill="#FDE9D9" stroke="#ED7D31" stroke-width="2.5"/>
  <text x="1600" y="445" font-size="30" font-weight="700" fill="#833C00">80 s</text>

  <!-- Row 3: Proposed hub -->
  <text x="240" y="570" text-anchor="end" font-size="24" font-weight="700" fill="#262626">Proposed hub</text>
  <rect x="260" y="540" width="1420" height="70" fill="#F5F5F5" stroke="#D9D9D9" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="260" y="540" width="49" height="70" fill="#E2F0E3" stroke="#548235" stroke-width="3"/>
  <text x="335" y="585" font-size="30" font-weight="700" fill="#274E13">&lt; 3 s (0.83–2.87 s measured)</text>

  <!-- Callout: order of magnitude -->
  <rect x="1360" y="700" width="440" height="150" rx="16" fill="#FFF6D9" stroke="#BF9000" stroke-width="2.5"/>
  <text x="1580" y="750" text-anchor="middle" font-size="24" font-weight="700" fill="#7F6000">Reduction of &gt; 1 order</text>
  <text x="1580" y="784" text-anchor="middle" font-size="24" font-weight="700" fill="#7F6000">of magnitude</text>
  <text x="1580" y="820" text-anchor="middle" font-size="19" fill="#7F6000">full replica vs. proposed hub</text>

  <!-- Bottom: patient identity unification, field-validated -->
  <line x1="90" y1="680" x2="1830" y2="680" stroke="#BFBFBF" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="120" y="730" font-size="26" font-weight="700" fill="#262626">Patient identity unification · field validation</text>

  <g>
    <text x="150" y="808" font-size="44" font-weight="800" fill="#1F3864">12 patients</text>
    <text x="150" y="843" font-size="24" fill="#262626">58 records synced through the hub</text>
    <circle cx="164" cy="871" r="15" fill="#548235"/>
    <path d="M157,871 L162,877 L173,864" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="192" y="878" font-size="23" font-weight="700" fill="#274E13">All synced cleanly · 0 identity conflicts</text>
  </g>

  <g font-size="22" fill="#262626">
    <text x="965" y="775" text-anchor="middle" font-size="19" fill="#7F7F7F">Per patient, across the 3 apps</text>
    <circle cx="895" cy="815" r="13" fill="#4472C4"/><circle cx="930" cy="815" r="13" fill="#4472C4"/><circle cx="965" cy="815" r="13" fill="#4472C4"/>
    <text x="993" y="822">3 IDs</text>
    <line x1="1060" y1="815" x2="1107" y2="815" stroke="#7F7F7F" stroke-width="2.5" marker-end="url(#arrowGray)"/>
    <circle cx="1150" cy="815" r="15" fill="#548235"/>
    <text x="1175" y="822" font-weight="700" fill="#274E13">1 shared ID</text>
  </g>

  <rect x="90" y="960" width="1740" height="70" rx="12" fill="#EDEDED" stroke="#595959" stroke-width="2"/>
  <text x="960" y="1005" text-anchor="middle" font-size="24" fill="#262626">Patient identity unification: <tspan font-weight="700">automatic</tspan> only in the proposed hub</text>
</svg>
