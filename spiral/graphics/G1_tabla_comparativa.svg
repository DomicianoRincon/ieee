    <text x="66" y="734" font-size="27" font-weight="700" fill="#274E13">(Vimov)</text>
    <text x="446" y="717" font-size="27" font-weight="700" fill="#274E13">Pen + Android tablet</text>
    <text x="926" y="700" font-size="27" font-weight="700" fill="#274E13">Temporal, speed, amplitude,</text>
    <text x="926" y="734" font-size="27" font-weight="700" fill="#274E13">frequency; local, real-time.</text>
    <text x="1706" y="717" font-size="27" font-weight="700" fill="#274E13">Native to Vimov; FFT + statistical.</text>
