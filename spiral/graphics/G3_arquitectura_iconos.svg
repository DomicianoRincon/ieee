<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%"
     role="img" aria-labelledby="ttl dsc"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
  <title id="ttl">Vimov system architecture</title>
  <desc id="dsc">Incognitus on a tablet sends the trace to the Vimov API, which saves the sample to MinIO and queues the analysis on Redis; a Celery worker picks up the task, saves the result to MinIO and the metrics to PostgreSQL. Vimov Web, on a laptop, queries the same API.</desc>

  <defs>
    <style>
      :root, svg {
        --bg:#FFFFFF; --surface:#FFFFFF;
        --ink:#161A26; --ink-2:#454C61; --ink-3:#79809A; --line:#D9DEE8;
        --indigo-s:#EEF1FF; --indigo-b:#A9B4F2; --indigo-t:#4453C9;
        --teal-s:#E3F6F3;   --teal-b:#86D3CA;   --teal-t:#0F8478;
        --amber-s:#FFF3DC;  --amber-b:#F0C572;  --amber-t:#A96C05;
        --rose-s:#FFEBEF;   --rose-b:#F3A3B2;   --rose-t:#C2354F;
        --slate-s:#EFF1F5;  --slate-b:#C4CBD8;  --slate-t:#556074;
      }
      .card  { stroke-width:1.5; }
      .hero  { stroke-width:2.5; filter:url(#lift); }

      .n-indigo{fill:var(--indigo-s); stroke:var(--indigo-b);} .t-indigo{fill:var(--indigo-t);}
      .n-teal  {fill:var(--teal-s);   stroke:var(--teal-b);}   .t-teal  {fill:var(--teal-t);}
      .n-amber {fill:var(--amber-s);  stroke:var(--amber-b);}  .t-amber {fill:var(--amber-t);}
      .n-slate {fill:var(--slate-s);  stroke:var(--slate-b);}  .t-slate {fill:var(--slate-t);}

      .f-indigo{fill:var(--indigo-t);} .f-teal{fill:var(--teal-t);} .f-amber{fill:var(--amber-t);}

      .nt   {font-size:16px; font-weight:700;}
      .nb   {fill:var(--ink-3); font-size:13px;}
      .lbl  {fill:var(--ink-3); font-size:13px; font-weight:500;}
      .chip {fill:#FFFFFF; font-size:12.5px; font-weight:700;}
      .foot {fill:var(--ink-3); font-size:12.5px;}
      .tiny {fill:var(--ink-3); font-size:11.5px; font-weight:600;}

      .link      {fill:none; stroke:var(--slate-t); stroke-width:2; marker-end:url(#arrow);}
      .link-async{stroke-dasharray:6 5;}

      /* Dos flujos animados: captura (tablet -> API -> cola -> worker -> storage,
         escalonado con animation-delay para que se vea la posta) y visualización
         (Vimov Web y API, consulta/responde, con su propio ritmo independiente). */
      .flow-capture, .flow-web { stroke-dasharray: 8 7; }
      .flow-capture { animation: flow-move 0.85s linear infinite; }
      .flow-web     { animation: flow-move 1.3s linear infinite; }
      @keyframes flow-move { to { stroke-dashoffset: -15; } }
      @media (prefers-reduced-motion: reduce) {
        .flow-capture, .flow-web { animation: none; }
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5"
            markerUnits="strokeWidth" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L2.4,5 Z" fill="context-stroke"/>
    </marker>
    <marker id="dot" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="4.5" markerHeight="4.5">
      <circle cx="4" cy="4" r="3.2" fill="context-stroke"/>
    </marker>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#0B1020" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="#FFFFFF"/>

  <!-- ═══ Incognitus (tablet) ═══ -->
  <g transform="translate(150,140)">
    <circle r="42" class="n-indigo card"/>
    <rect x="-15" y="-23" width="30" height="46" rx="5" fill="none" stroke="var(--indigo-t)" stroke-width="2.4"/>
    <circle cx="0" cy="17" r="2" fill="var(--indigo-t)"/>
    <text class="nt t-indigo" x="0" y="60" text-anchor="middle" data-fit="150">Incognitus</text>
    <text class="nb" x="0" y="77" text-anchor="middle" data-fit="150">tablet · Android</text>
  </g>
  <!-- médico (badge compacto) -->
  <g transform="translate(96,76)">
    <circle r="15" fill="var(--surface)" stroke="var(--slate-t)" stroke-width="1.5"/>
    <circle cx="0" cy="-4" r="4" fill="none" stroke="var(--slate-t)" stroke-width="1.6"/>
    <path d="M-6,7 A6,6 0 0 1 6,7" fill="none" stroke="var(--slate-t)" stroke-width="1.6" stroke-linecap="round"/>
    <text class="tiny" x="0" y="27" text-anchor="middle" data-fit="70">Doctor</text>
  </g>
  <!-- auto-loop: también procesa localmente -->
  <path d="M180,116 C204,98 200,72 176,66" fill="none" stroke="var(--indigo-b)"
        stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#dot)"/>
  <text class="lbl" x="196" y="86" data-fit="120">also local</text>

  <!-- ═══ Vimov Web (laptop) ═══ -->
  <g transform="translate(150,340)">
    <circle r="42" class="n-indigo card"/>
    <rect x="-18" y="-19" width="36" height="23" rx="3" fill="none" stroke="var(--indigo-t)" stroke-width="2.4"/>
    <path d="M-24,9 L24,9 L19,17 L-19,17 Z" fill="var(--indigo-t)"/>
    <text class="nt t-indigo" x="0" y="60" text-anchor="middle" data-fit="150">Vimov Web</text>
    <text class="nb" x="0" y="77" text-anchor="middle" data-fit="150">React · laptop</text>
  </g>

  <!-- ═══ Vimov API (Flask) — protagonista ═══ -->
  <g transform="translate(470,240)">
    <circle r="56" class="hero n-indigo"/>
    <rect x="-20" y="-26" width="40" height="14" rx="3.4" fill="none" stroke="var(--indigo-t)" stroke-width="2.3"/>
    <circle cx="-12" cy="-19" r="1.8" fill="var(--indigo-t)"/>
    <rect x="-20" y="-7" width="40" height="14" rx="3.4" fill="none" stroke="var(--indigo-t)" stroke-width="2.3"/>
    <circle cx="-12" cy="0" r="1.8" fill="var(--indigo-t)"/>
    <rect x="-20" y="12" width="40" height="14" rx="3.4" fill="none" stroke="var(--indigo-t)" stroke-width="2.3"/>
    <circle cx="-12" cy="19" r="1.8" fill="var(--indigo-t)"/>
    <text class="nt t-indigo" x="0" y="76" text-anchor="middle" font-size="16" data-fit="170">Vimov API</text>
    <text class="nb" x="0" y="94" text-anchor="middle" data-fit="150">Flask · central hub</text>
  </g>

  <!-- ═══ Cola de tareas (Redis) — dibujada como cola ═══ -->
  <g transform="translate(770,140)">
    <rect x="-53" y="-33" width="106" height="68" rx="16" class="n-amber card"/>
    <rect x="-34" y="-2" width="30" height="41" rx="5" fill="var(--surface)" stroke="var(--amber-b)" stroke-width="1.4" opacity="0.7"/>
    <rect x="-19" y="-7" width="30" height="41" rx="5" fill="var(--surface)" stroke="var(--amber-b)" stroke-width="1.4" opacity="0.9"/>
    <rect x="-4" y="-12" width="30" height="41" rx="5" fill="var(--amber-s)" stroke="var(--amber-t)" stroke-width="2"/>
    <line x1="3" y1="-1" x2="17" y2="-1" stroke="var(--amber-t)" stroke-width="2" stroke-linecap="round"/>
    <line x1="3" y1="6" x2="17" y2="6" stroke="var(--amber-t)" stroke-width="2" stroke-linecap="round"/>
    <line x1="3" y1="13" x2="13" y2="13" stroke="var(--amber-t)" stroke-width="2" stroke-linecap="round"/>
    <text class="nt t-amber" x="0" y="56" text-anchor="middle" data-fit="150">Task queue</text>
    <text class="nb" x="0" y="73" text-anchor="middle" data-fit="130">Redis</text>
  </g>

  <!-- ═══ Celery Worker (engranaje) ═══ -->
  <g transform="translate(770,340)">
    <circle r="42" class="n-amber card"/>
    <g stroke="var(--amber-t)" fill="var(--amber-t)">
      <circle r="14" fill="none" stroke-width="2.4"/>
      <rect x="-2.4" y="-21" width="4.8" height="7" rx="1.1"/>
      <rect x="-2.4" y="-21" width="4.8" height="7" rx="1.1" transform="rotate(45)"/>
      <rect x="-2.4" y="-21" width="4.8" height="7" rx="1.1" transform="rotate(90)"/>
      <rect x="-2.4" y="-21" width="4.8" height="7" rx="1.1" transform="rotate(135)"/>
      <rect x="-2.4" y="-21" width="4.8" height="7" rx="1.1" transform="rotate(180)"/>
      <rect x="-2.4" y="-21" width="4.8" height="7" rx="1.1" transform="rotate(225)"/>
      <rect x="-2.4" y="-21" width="4.8" height="7" rx="1.1" transform="rotate(270)"/>
      <rect x="-2.4" y="-21" width="4.8" height="7" rx="1.1" transform="rotate(315)"/>
      <circle r="5.5" fill="var(--surface)" stroke-width="1.6"/>
    </g>
    <text class="nt t-amber" x="0" y="60" text-anchor="middle" data-fit="150">Celery Worker</text>
    <text class="nb" x="0" y="77" text-anchor="middle" data-fit="150">FFT · filtering</text>
  </g>

  <!-- ═══ MinIO (bucket) ═══ -->
  <g transform="translate(1050,140)">
    <circle r="42" class="n-teal card"/>
    <path d="M-14,-14 L14,-14 L10,17 L-10,17 Z" fill="none" stroke="var(--teal-t)" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M-14,-14 Q0,-7 14,-14" fill="none" stroke="var(--teal-t)" stroke-width="2.4"/>
    <path d="M-7,-1 Q0,5 7,-1" fill="none" stroke="var(--teal-t)" stroke-width="1.5" opacity="0.6"/>
    <text class="nt t-teal" x="0" y="60" text-anchor="middle" data-fit="150">MinIO</text>
    <text class="nb" x="0" y="77" text-anchor="middle" data-fit="150">objects (S3)</text>
  </g>

  <!-- ═══ PostgreSQL (cilindro) ═══ -->
  <g transform="translate(1050,340)">
    <circle r="42" class="n-teal card"/>
    <path fill="none" stroke="var(--teal-t)" stroke-width="2.4" d="M-16,-14 A16,5.8 0 0 1 16,-14 V14 A16,5.8 0 0 1 -16,14 Z"/>
    <path fill="none" stroke="var(--teal-t)" stroke-width="1.9" d="M-16,-14 A16,5.8 0 0 0 16,-14"/>
    <text class="nt t-teal" x="0" y="60" text-anchor="middle" data-fit="150">PostgreSQL</text>
    <text class="nb" x="0" y="77" text-anchor="middle" data-fit="150">metrics</text>
  </g>

  <!-- ═══ Flechas ═══ -->

  <!-- 1: Incognitus -> Vimov API -->
  <path class="link flow-capture" stroke="var(--indigo-t)" style="animation-delay:0s" d="M192,140 H310 V220 H414"/>
  <rect x="196" y="176" width="82" height="16" fill="var(--bg)"/>
  <text class="lbl" x="237" y="188" text-anchor="middle" data-fit="78">trace (X,Y,t)</text>
  <g transform="translate(310,180)"><circle r="11" class="f-indigo"/><text class="chip" text-anchor="middle" dy="0.35em">1</text></g>

  <!-- Vimov Web <-> Vimov API (consulta) -->
  <path class="link flow-web" stroke="var(--indigo-t)" marker-start="url(#arrow)" d="M192,340 H270 V260 H414"/>
  <rect x="196" y="292" width="66" height="16" fill="var(--bg)"/>
  <text class="lbl" x="229" y="304" text-anchor="middle" data-fit="62">query</text>

  <!-- 2: Vimov API -> Cola -->
  <path class="link flow-capture" stroke="var(--amber-t)" style="animation-delay:0.4s" d="M488,184 V90 H716"/>
  <rect x="560" y="81" width="52" height="16" fill="var(--bg)"/>
  <text class="lbl" x="586" y="93" text-anchor="middle" data-fit="48">queues</text>
  <g transform="translate(488,140)"><circle r="11" class="f-amber"/><text class="chip" text-anchor="middle" dy="0.35em">2</text></g>

  <!-- Cola -> Worker -->
  <path class="link flow-capture" stroke="var(--amber-t)" style="animation-delay:0.8s" d="M770,175 V298"/>

  <!-- Vimov API -> MinIO (guarda muestra cruda) -->
  <path class="link flow-capture" stroke="var(--teal-t)" style="animation-delay:0.4s" d="M452,184 V40 H1050 V98"/>
  <rect x="700" y="31" width="128" height="16" fill="var(--bg)"/>
  <text class="lbl" x="764" y="43" text-anchor="middle" data-fit="122">saves raw sample</text>

  <!-- 3: Worker -> MinIO / PostgreSQL -->
  <path class="link flow-capture" stroke="var(--teal-t)" style="animation-delay:1.2s" d="M812,340 H900 V140 H1008"/>
  <path class="link flow-capture" stroke="var(--teal-t)" style="animation-delay:1.2s" d="M812,340 H1008"/>
  <g transform="translate(900,340)"><circle r="11" class="f-teal"/><text class="chip" text-anchor="middle" dy="0.35em">3</text></g>
  <rect x="906" y="248" width="52" height="16" fill="var(--bg)"/>
  <text class="lbl" x="932" y="260" text-anchor="middle" data-fit="48">saves</text>
  <rect x="906" y="316" width="60" height="16" fill="var(--bg)"/>
  <text class="lbl" x="936" y="328" text-anchor="middle" data-fit="56">metrics</text>

  <!-- ═══ Leyenda ═══ -->
  <g transform="translate(48,448)">
    <rect x="0" y="0" width="12" height="12" rx="3" class="card n-indigo"/>
    <text class="foot" x="19" y="6" dy="0.35em" data-fit="80">Application</text>
    <rect x="112" y="0" width="12" height="12" rx="3" class="card n-teal"/>
    <text class="foot" x="131" y="6" dy="0.35em" data-fit="100">Storage</text>
    <rect x="256" y="0" width="12" height="12" rx="3" class="card n-amber"/>
    <text class="foot" x="275" y="6" dy="0.35em" data-fit="80">Queue / async</text>
    <path class="flow-capture" d="M384,6 H416" fill="none" stroke="var(--slate-t)" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text class="foot" x="424" y="6" dy="0.35em" data-fit="120">Data flow</text>
  </g>
  <text class="foot" x="1152" y="454" text-anchor="end" data-fit="260">Archimedes Spiral · Vimov ecosystem</text>
</svg>
